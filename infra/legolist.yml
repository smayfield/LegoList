AWSTemplateFormatVersion: "2010-09-09"
Description: >
  LegoList at legolist.magicworld.com: one small ARM EC2 server running the app
  stack in Docker (Caddy, Blazor, API, PostgreSQL, Liquibase), with ECR image
  repos, an ops bucket for deploy files and DB backups, daily EBS snapshots, a
  DNS record in the magicworld.com zone, and a GitHub Actions OIDC deploy role.
  Deploy in us-east-1.

Parameters:
  HostName:
    Type: String
    Default: legolist.magicworld.com
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
  GitHubSub:
    Type: String
    Default: repo:smayfield/LegoList:ref:refs/heads/main
    Description: >
      OIDC subject allowed to deploy. This repo uses GitHub's name-based subject
      format (see `gh api repos/smayfield/LegoList/actions/oidc/customization/sub`).
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  # ---------- Network: one public subnet, no NAT ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: legolist }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: legolist-public }]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }

  WebSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LegoList web (HTTP/HTTPS only; admin via SSM Session Manager)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  # ---------- Storage ----------
  OpsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-backups, Status: Enabled, Prefix: backups/, ExpirationInDays: 30 }
          - { Id: expire-deploy-files, Status: Enabled, Prefix: deploy/, ExpirationInDays: 30 }

  EcrApi:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: legolist-api
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}
  EcrBlazor:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: legolist-blazor
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}
  EcrMigrate:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: legolist-migrate
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  # ---------- Server ----------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: legolist-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: legolist-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/legolist/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${OpsBucket.Arn}/deploy/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt OpsBucket.Arn
                Condition: { StringLike: { "s3:prefix": "deploy/*" } }
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${OpsBucket.Arn}/backups/*
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref WebSg]
      PropagateTagsToVolumeOnCreation: true
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: false }
      Tags:
        - { Key: Name, Value: legolist }
        - { Key: Backup, Value: legolist }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          mkdir -p /usr/libexec/docker/cli-plugins
          curl -fsSL -o /usr/libexec/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose
          systemctl enable --now docker
          # 2 GB swap as headroom for two .NET apps plus PostgreSQL
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile && mkswap /swapfile
            echo '/swapfile none swap defaults 0 0' >> /etc/fstab
          fi
          swapon -a
          mkdir -p /opt/legolist

  ServerIp:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties:
      Domain: vpc
      InstanceId: !Ref Server
      Tags: [{ Key: Name, Value: legolist }]

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue magicworld-HostedZoneId
      Name: !Ref HostName
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerIp]

  # ---------- Daily EBS snapshots (keep 7) ----------
  DlmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole
  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily snapshots of the LegoList server disk
      State: ENABLED
      ExecutionRoleArn: !GetAtt DlmRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags: [{ Key: Backup, Value: legolist }]
        Schedules:
          - Name: daily
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["08:00"] }
            RetainRule: { Count: 7 }
            CopyTags: true

  # ---------- GitHub Actions deploy role ----------
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: legolist-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSub
      Policies:
        - PolicyName: deploy-legolist
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt EcrApi.Arn
                  - !GetAtt EcrBlazor.Arn
                  - !GetAtt EcrMigrate.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${OpsBucket.Arn}/deploy/*
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Server}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

Outputs:
  InstanceId:
    Value: !Ref Server
  PublicIp:
    Value: !Ref ServerIp
  OpsBucket:
    Value: !Ref OpsBucket
  EcrRegistry:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
